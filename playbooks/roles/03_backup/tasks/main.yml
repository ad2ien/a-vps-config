---
- name: Create backup folder
  file:
    path: "{{ app_path }}/backup"
    state: directory
  register: stack_folder

- name: Copy backup scripts
  copy:
    src: "{{ item }}"
    dest: "{{ app_path }}/backup/{{ item }}"
    mode: "0755"
    owner: "{{ ansible_user }}"
  loop:
    - backup-logger.sh
    - restic.sh

- name: Copy backup template files to backup
  template:
    src: "{{ item }}"
    dest: "{{ app_path }}/backup/{{ item | replace('.j2', '') }}"
    mode: "0644"
    owner: "{{ ansible_user }}"
  loop:
    - compose.yaml
    - rclone.conf
    - .env.j2
  register: backup_config

- name: init volume backup
  shell: |
    # init is idempotent
    cd "{{ app_path }}/backup"
    ./restic.sh stack init
    ./restic.sh volume init
  when: stack_folder.changed

