- name: Schedule backup-logger.sh to run at 4:30 AM
  ansible.builtin.cron:
    name: "Run backup logger"
    minute: "30"
    hour: "4"
    job: "cd {{ app_path }}/backup && bash backup-logger.sh"
    user: root
