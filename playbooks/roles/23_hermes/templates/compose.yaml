name: wam-hermes
services:
  gateway:
    image: nousresearch/hermes-agent
    restart: unless-stopped
    volumes:
      - ./hermes-data:/opt/data
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY}
    networks:
      - internal

  open-webui:
    image: ghcr.io/open-webui/open-webui:slim
    container_name: open-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://gateway:8642/v1
      OPENAI_API_KEY: ${HERMES_API_KEY}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.hermess-wam.rule=Host(`${SUB_DOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.hermess-wam.entrypoints=websecure"
      - "traefik.http.services.hermess-wam.loadbalancer.server.port=8080"
      - "traefik.http.routers.hermess-wam.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermess-wam.middlewares=crowdsec@docker"

volumes:
  open-webui:

networks:
  internal:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
