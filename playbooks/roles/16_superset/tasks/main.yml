---
- name: Create superset path
  file:
    path: "{{ app_path }}/{{ tenant }}/superset"
    state: directory
    mode: "0775"

- name: Copy template files to superset
  template:
    src: "{{ item }}"
    dest: "{{ app_path }}/{{ tenant }}/superset/{{ item | replace('.j2', '') }}"
    mode: "0644"
  loop:
    - compose.yaml.j2
    - .env.j2
  register: superset_config

- name: Stop stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}/{{ tenant }}/superset"
    state: absent
  when: superset_config.changed

- name: Start stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}/{{ tenant }}/superset"
    state: present
