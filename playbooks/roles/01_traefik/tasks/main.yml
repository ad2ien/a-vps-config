---
- name: Create traefik directory if it doesn't exist
  file:
    path: "{{ app_path }}/traefik/crowdsec"
    state: directory

- name: Copy traefik template files to traefik
  template:
    src: "{{ item }}"
    dest: "{{ app_path }}/traefik/{{ item | replace('.j2', '') }}"
    mode: "0644"
  loop:
    - compose.yaml
    - traefik.yml.j2
    - dynamic.yml.j2
    - .env.j2
    - crowdsec/appsec.yaml
  register: traefik_config

- name: Copy CrowdSec Cloudflare whitelist
  copy:
    src: crowdsec/whitelist-cloudflare.yaml
    dest: "{{ app_path }}/traefik/crowdsec/whitelist-cloudflare.yaml"
    mode: "0644"
  register: traefik_whitelist

- name: Stop Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}/traefik"
    state: absent
  when: traefik_config.changed or traefik_whitelist.changed

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}/traefik"
    state: present
