---
- name: Update and upgrade packages
  apt:
    name: "*"
    state: latest

- name: Install packages
  apt:
    name: "{{ item }}"
    state: latest
  loop:
    - ca-certificates
    - curl
    - logrotate
    - python3-debian  # required by deb822_repository

- name: debug display inventory_hostname
  ansible.builtin.debug:
    msg: System {{ inventory_hostname }}

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Configure sshd
  lineinfile:
    path: "/etc/ssh/sshd_config"
    regex: "^(#)?{{item.key}}"
    line: "{{item.key}} {{item.value}}"
    state: present
  loop:
    - {key: "PermitRootLogin", value: "no"}
    - {key: "PasswordAuthentication", value: "no"}
    - {key: "X11Forwarding", value: "no"}
    - {key: "PermitEmptyPasswords", value: "no"}
  notify:
    - restart sshd

- name: Configure logrotate for /var/log
  copy:
    src: logrotate-var-log
    dest: /etc/logrotate.d/var-log
    owner: root
    group: root
    mode: 0644

- name: Allow everything and enable UFW
  community.general.ufw:
    state: enabled
    policy: allow

- name: Fail2ban
  apt:
    name: "fail2ban"
    state: latest

- name: Add Docker Repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: [https://download.docker.com/linux/debian]
    suites: [bookworm]
    components: [stable]
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present

- name: Remove legacy Docker apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Update apt and install docker-ce
  apt:
    name: docker-ce
    state: latest
    update_cache: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  when: ansible_user is defined

- name: Create apps server folder
  file:
    path: "{{ app_path }}"
    state: directory

- name: Install apt upgrade script
  ansible.builtin.copy:
    src: apt-upgrade.sh
    dest: /usr/local/bin/apt-upgrade.sh
    mode: "0755"

- name: Schedule weekly apt upgrade
  ansible.builtin.cron:
    name: "Weekly apt upgrade"
    minute: "30"
    hour: "4"
    weekday: "0"
    job: /usr/local/bin/apt-upgrade.sh
    user: root
