# Ex of command to configure a server that doesn't have a public IP address :
# ansible-playbook playbooks/wireguard.yml -i inventory/hosts.yml --limit "master,private_network_node" -t wireguard

---
- name: Configure WireGuard on master
  hosts: master
  become: true
  tags: wireguard
  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
        state: present

    - name: Allow WireGuard port in UFW
      community.general.ufw:
        rule: allow
        port: "51821"
        proto: udp

    - name: Create clients directory
      file:
        path: /etc/wireguard/clients
        state: directory
        mode: "0700"

    - name: Check if WireGuard config already exists
      stat:
        path: /etc/wireguard/wg0.conf
      register: wg_config

    - name: Read existing server private key
      shell: grep "^PrivateKey" /etc/wireguard/wg0.conf | awk '{print $3}'
      register: existing_server_private
      when: wg_config.stat.exists
      changed_when: false

    - name: Generate server private key if not exists
      shell: wg genkey
      register: server_private_key
      when: not wg_config.stat.exists
      changed_when: false

    - name: Derive server public key from private key
      shell: echo "{% if wg_config.stat.exists %}{{ existing_server_private.stdout }}{% else %}{{ server_private_key.stdout }}{% endif %}" | wg pubkey
      register: server_public_key
      changed_when: false

    - name: Generate keys for each client if not exists
      shell: |
        if [ ! -f /etc/wireguard/clients/{{ item }}_private.key ]; then
          wg genkey > /etc/wireguard/clients/{{ item }}_private.key
          chmod 600 /etc/wireguard/clients/{{ item }}_private.key
        fi
      loop: "{{ groups['private_network_node'] }}"
      changed_when: false

    - name: Read client public keys
      shell: cat /etc/wireguard/clients/{{ item }}_private.key | wg pubkey
      register: client_public_keys
      loop: "{{ groups['private_network_node'] }}"
      changed_when: false

    # IPs come from what is already in wg0.conf, not from the position in the
    # group: a node keeps its address across runs, a new node takes the first
    # address above the highest one in use.
    - name: Parse existing peer entries from wg0.conf
      # Emits {"publickey": last-octet, ...}; {} when the file does not exist.
      shell: |
        set -eu
        if [ -f /etc/wireguard/wg0.conf ]; then
          awk 'BEGIN {printf "{"}
               $1=="PublicKey" && NF>=3 {pk=$3}
               $1=="AllowedIPs" && NF>=3 && pk!="" {
                 ip=$3; sub(/\/.*$/, "", ip); split(ip, a, ".");
                 if (n++) printf ",";
                 printf "\"%s\": %d", pk, a[4]+0;
                 pk=""
               }
               END {printf "}"}' /etc/wireguard/wg0.conf
        else
          printf '{}'
        fi
      register: wg_peers_raw
      changed_when: false

    - name: Map existing peer public keys to their address octets
      set_fact:
        wg_existing_peer_ips: "{{ wg_peers_raw.stdout | default('{}', true) | from_json }}"

    - name: Fail before allocating if the client pool is exhausted
      assert:
        that:
          - used_octets | max < 254
        fail_msg: "No free 10.13.13.x address left; remove stale peers from wg0.conf or extend the subnet."
        quiet: true
      vars:
        used_octets: >-
          {{ (wg_existing_peer_ips | default({}) | dictsort
              | map(attribute=1) | list) + [1] }}

    - name: Allocate client IPs (keep existing, next free for new nodes)
      set_fact:
        wg_client_ips: "{{ wg_client_ips | default({}) | combine({item.0: client_ip}) }}"
      loop: "{{ groups['private_network_node'] | zip(client_public_keys.results) | list }}"
      loop_control:
        label: "{{ item.0 }}"
      vars:
        client_pubkey: "{{ item.1.stdout | trim }}"
        # clients earlier in this run that get a fresh address (have no entry yet)
        fresh_so_far: >-
          {{ client_public_keys.results[: loop.index - 1]
             | map(attribute='stdout') | map('trim')
             | reject('in', wg_existing_peer_ips | default({})) | list | length }}
        next_octet: >-
          {{ ((wg_existing_peer_ips | default({}) | dictsort
               | map(attribute=1) | list) + [1]) | max
             + fresh_so_far + 1 }}
        client_ip: >-
          {{ '10.13.13.' ~ (wg_existing_peer_ips[client_pubkey] | default(next_octet) | string) }}

    - name: Set server facts
      set_fact:
        wg_server_private: "{% if wg_config.stat.exists %}{{ existing_server_private.stdout }}{% else %}{{ server_private_key.stdout }}{% endif %}"
        wg_server_public: "{{ server_public_key.stdout }}"

    - name: Create WireGuard [Interface] section
      blockinfile:
        path: /etc/wireguard/wg0.conf
        block: |
          [Interface]
          PrivateKey = {{ wg_server_private }}
          Address = 10.13.13.1/24
          ListenPort = 51821
        marker: "# {mark} INTERFACE MANAGED BY ANSIBLE"
        create: yes
        mode: "0600"

    - name: Add client peers to WireGuard config
      blockinfile:
        path: /etc/wireguard/wg0.conf
        block: |
          [Peer]
          PublicKey = {{ item.1.stdout }}
          AllowedIPs = {{ wg_client_ips[item.0] }}/32
        marker: "# {mark} {{ item.0 }} PEER MANAGED BY ANSIBLE"
      loop: "{{ groups['private_network_node'] | zip(client_public_keys.results) | list }}"

    # - name: "Add nft rule : sudo nft add rule ip nat POSTROUTING ip saddr 10.13.13.0/24 oifname eth0 masquerade"
    #   nftables:
    #     tables:
    #       example:
    #         chains:
    #           translate:
    #             hook: 'postrouting'
    #             type: 'nat'
    #             policy: 'accept'
    #             rules:
    #               - {'src': '10.13.13.0/24', oif: '{{ network_interface }}', masquerade: true}

    - name: Enable and start WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

- name: Configure WireGuard client on private nodes
  hosts: private_network_node
  become: true
  tags: wireguard
  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
        state: present

    - name: Read client private key from master
      slurp:
        src: /etc/wireguard/clients/{{ inventory_hostname }}_private.key
      register: client_private_key
      delegate_to: "{{ groups['master'][0] }}"

    - name: Create WireGuard client [Interface] section
      blockinfile:
        path: /etc/wireguard/wg0.conf
        block: |
          [Interface]
          PrivateKey = {{ client_private_key.content | b64decode | trim }}
          Address = {{ hostvars[groups['master'][0]].wg_client_ips[inventory_hostname] }}/24
        marker: "# {mark} INTERFACE MANAGED BY ANSIBLE"
        create: yes
        mode: "0600"

    - name: Add server peer to client WireGuard config
      blockinfile:
        path: /etc/wireguard/wg0.conf
        block: |
          [Peer]
          PublicKey = {{ hostvars[groups['master'][0]].wg_server_public }}
          Endpoint = {{ hostvars[groups['master'][0]].ansible_host }}:51821
          AllowedIPs = 10.13.13.0/24
          PersistentKeepalive = 25
        marker: "# {mark} SERVER PEER MANAGED BY ANSIBLE"

    - name: Enable and start WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
